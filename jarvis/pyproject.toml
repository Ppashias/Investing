[project]
name = "jarvis"
version = "0.1.0"
description = "JARVIS — personal AI operating system. Phase 1: core orchestration layer."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "anthropic>=0.40",
    "httpx>=0.27",
    "structlog>=24.1",
    # Obsidian frontmatter. Only ever `safe_load` — a vault is a folder anything
    # can write to, and a loader that constructs Python objects would make it an
    # execution primitive.
    "pyyaml>=6",
    # Tool-argument validation. Imported unguarded by tools/executor.py, which
    # every request path reaches.
    "jsonschema>=4.20",
    # Vector search. memory/vectors.py imports it at module level and the
    # knowledge and memory services both import that, so the API cannot start
    # without it.
    "numpy>=1.26",
    # FastAPI needs it to accept the document-upload form. Not an optional
    # extra: without it `create_app` raises while building the route table, so
    # the whole API fails to start, not just uploads.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
keyring = ["keyring>=25.0"]
# Browser control (Phase 4). An extra rather than a hard dependency: Playwright
# pulls a browser download behind it, and a JARVIS that never browses should not
# be unable to start without one. jarvis.browser.capabilities.detect reports its
# absence as an unavailable capability with the install command in the reason,
# which is the same shape Phase 3 uses for a missing display.
#
# Installing the package is not enough on its own — `playwright install chromium`
# fetches the browser, and detection says so when it is missing.
browser = ["playwright>=1.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "anyio>=4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
